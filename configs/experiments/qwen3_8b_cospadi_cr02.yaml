# @package _global_
# CoSpaDi deployable configuration for Qwen/Qwen3-8B, CR=0.2.
# Requires precomputed X^T X calibration statistics under calib_root.
defaults:
  - override /model: qwen3_8b
  - override /method: ksvd
  - override /evaluation: compot

compression_ratio: 0.2
calib_root: ${oc.env:COSPADI_CALIB_ROOT,${repo_root}/calibration}/Qwen/Qwen3-8B
method:
  iterations: 60
  power_iterations: 8
  ks_ratio: 2.0
stages:
  collect: false
  compress: true
  evaluate: true
  report: true
